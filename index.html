<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Slot Machine</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Quicksand|Raleway" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <div class="title">
            <h2>🍏 Slot Machine 🍌</h2>
        </div>
        <div class="deposit-amount">
            <h4>Enter your deposit amount:</h4>
            <input type="number" id="deposit-amount">
        </div>
        <div class="amount-line">
            <h4>Enter the amount per line bet:</h4>
            <input type="money" id="amount-per-line">
        </div>
        <button id="spin">Spin</button>
        <div id="return">
            <div class="return-div" id="return-div"></div>
            <div class="return-div" id="return-div-two"></div>
            <div class="return-div" id="return-div-three"></div>
        </div>
        <div id="return">
            <div class="return-div" id="return-div-four"></div>
            <div class="return-div" id="return-div-five"></div>
            <div class="return-div" id="return-div-six"></div>
        </div>
        <div class="amount-won">
            <h4>You won:</h4>
            <div class="amount" id="amount-won"></div>
        </div>
        <div class="current-balance">
            <h4>Your current balance is:</h4>
            <div class="balance" id="current-balance"></div>
        </div>
        <div class="play-again">
            <h4>Would you like to play again?</h4>
            <button class="play-again" id="play-again">
                Yes
            </button>
            <button class="no-play" id="no-play">
                No
            </button>
        </div>
    </div>






    <script src="app.js"></script>
</body>
</html>
